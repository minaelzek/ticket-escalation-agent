name: Bug report
description: Something in ticket-escalation-agent does not behave as the README describes.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to write this up.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what came back?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
